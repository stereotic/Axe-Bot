<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <title>AXE PASS</title>
  <script src="/vendor/telegram-web-app.js" defer></script>
  <style>
    :root{color-scheme:dark;--bg:#09070e;--purple:#a855f7;--text:#f5f0ff;--muted:#aaa2bc}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(100% 45% at 50% 0,#39135d 0,transparent 65%),var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);padding:calc(env(safe-area-inset-top) + 20px) calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 22px) calc(env(safe-area-inset-left) + 16px)}header{position:sticky;top:0;padding:2px 0 17px;background:linear-gradient(var(--bg) 72%,transparent);z-index:2}.title{display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:900;letter-spacing:.12em}.lvl{color:#d9b9ff;border:1px solid #a855f777;border-radius:999px;padding:5px 9px;font-size:12px}.bar{height:7px;margin:14px 0 8px;background:#ffffff13;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#7c3aed,#d8b4fe);border-radius:inherit;box-shadow:0 0 16px #a855f7}.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:11px;font-weight:650}.levels{display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;padding:0 0 10px;touch-action:pan-x}.levels::-webkit-scrollbar{display:none}.card{position:relative;flex:0 0 100%;scroll-snap-align:start;overflow:hidden;border:1px solid #ffffff18;border-radius:20px;background:#ffffff08}.card.next{border-color:#a855f7aa;box-shadow:0 0 22px #a855f733}.card.done{border-color:#22c55e66}.art{height:235px;background:#130d1e}.art img{width:100%;height:100%;object-fit:cover;display:block}.locked .art img{filter:grayscale(.9) brightness(.45)}.badge{position:absolute;top:11px;left:11px;border-radius:999px;padding:5px 9px;background:#0c0911cc;border:1px solid #ffffff22;font-size:10px;font-weight:850}.body{min-height:154px;padding:15px 16px 18px}.body h2{margin:8px 0;font-size:21px}.body p{margin:0;color:var(--muted);font-size:13px;font-weight:650}.body a{display:inline-block;margin-top:13px;color:#d8b4fe;font-size:13px;font-weight:800;text-decoration:none}.nav{display:flex;justify-content:center;gap:12px;padding:4px 0 10px}.nav button{width:46px;height:36px;border:1px solid #a855f788;border-radius:12px;background:#1b1027;color:#f5eaff;font-size:22px;font-weight:800;line-height:1}.nav button:active{transform:scale(.95);background:#3a1d55}.loader,.error{padding:80px 15px;text-align:center;color:var(--muted)}.error{color:#f0b2c0}
  </style>
</head>
<body>
  <header><div class="title"><span>AXE · BATTLE PASS</span><span class="lvl" id="level">LVL 0</span></div><div class="bar"><i id="bar"></i></div><div class="meta"><span id="next">Загрузка…</span><span id="cash">—</span></div></header>
  <main id="levels" class="levels"><div class="loader">Загружаем AXE PASS…</div></main>
  <nav class="nav" aria-label="Навигация по призам"><button type="button" id="prev" aria-label="Предыдущий приз">‹</button><button type="button" id="nextBtn" aria-label="Следующий приз">›</button></nav>
  <script>
    const tg=window.Telegram?.WebApp,root=document.getElementById('levels'),esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),rub=n=>Math.round(n||0).toLocaleString('ru-RU').replace(/ /g,'.')+'₽',xp=n=>Number.isInteger(n)?String(n):Number(n||0).toFixed(2).replace(/0+$/,'').replace(/\.$/,'');
    const shift=direction=>root.scrollBy({left:direction*(root.clientWidth+12),behavior:'smooth'});document.getElementById('prev').onclick=()=>shift(-1);document.getElementById('nextBtn').onclick=()=>shift(1);async function boot(){const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),12000);try{const app=window.Telegram?.WebApp;app?.ready();app?.expand();app?.setHeaderColor?.('#09070e');app?.setBackgroundColor?.('#09070e');const q=new URLSearchParams;if(app?.initData)q.set('initData',app.initData);const dev=new URLSearchParams(location.search).get('user_id');if(dev)q.set('user_id',dev);const r=await fetch('/api/state?'+q,{cache:'no-store',signal:controller.signal});if(!r.ok)throw Error(r.status===401?'Открой AXE PASS кнопкой в боте.':'Сервер вернул '+r.status);const s=await r.json(),p=Math.round(s.levelProgress*100);document.getElementById('level').textContent='LVL '+s.level;document.getElementById('bar').style.width=p+'%';document.getElementById('next').textContent=s.level>=s.maxLevel?'ПАСС ПРОЙДЕН 🏆':'до LVL '+(s.level+1)+': '+xp(s.xpToNext)+' XP';document.getElementById('cash').textContent='касса '+rub(s.totalEarned);root.innerHTML=s.levels.map(l=>{const state=l.unlocked?'done':(l.level===s.level+1?'next':'locked'),tag=l.unlocked?'✓ ОТКРЫТ':(l.level===s.level+1?'СЛЕДУЮЩИЙ ПРИЗ':'🔒 ЗАКРЫТ'),link=l.unlocked&&l.link?'<a href="'+esc(l.link)+'">Посмотреть подарок →</a>':'';return '<article class="card '+state+'"><div class="art"><img src="'+esc(l.image)+'" alt=""><span class="badge">'+tag+'</span></div><div class="body"><b>LVL '+l.level+'</b><h2>'+esc(l.title)+'</h2><p>'+ (l.unlocked?'Получен':xp(l.requiredXp)+' XP · '+rub(l.requiredRub))+'</p>'+link+'</div></article>'}).join('');requestAnimationFrame(()=>root.querySelector('.card.next')?.scrollIntoView({block:'nearest',inline:'start'}))}catch(e){root.innerHTML='<div class="error">'+(e.name==='AbortError'?'Сервер долго не отвечает. Открой пасс ещё раз.':esc(e.message||'Сбой AXE PASS'))+'</div>'}finally{clearTimeout(timeout)}}window.addEventListener('DOMContentLoaded',boot,{once:true});
  </script>
</body>
</html>
