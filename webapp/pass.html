<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <title>AXE PASS</title>
  <script src="/vendor/telegram-web-app.js" defer></script>
  <style>
    :root{color-scheme:dark;--bg:#07060c;--purple:#a855f7;--text:#f3f0ff;--muted:#8b85a8}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg)}body{display:flex;flex-direction:column;background:radial-gradient(120% 70% at 50% 0%,#a855f72e,transparent 60%),radial-gradient(90% 55% at 50% 100%,#581c8738,transparent 65%),var(--bg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color:var(--text);padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 12px)}header{padding:0 0 10px;background:transparent;z-index:2}.title{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:800;letter-spacing:.2em;text-shadow:0 0 14px #a855f759}.title>span:first-child{white-space:nowrap}.lvl,.percent{color:var(--purple);border:1px solid #a855f759;border-radius:999px;padding:5px 10px;font-size:13px;letter-spacing:.1em}.bar{height:6px;margin:12px 0 7px;background:#ffffff12;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#7c3aed,#c084fc);border-radius:inherit;box-shadow:0 0 12px #a855f759;transition:width .5s}.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.04em}.levels{flex:1;display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;touch-action:pan-x}.levels::-webkit-scrollbar{display:none}.card{position:relative;align-self:center;flex:0 0 100%;scroll-snap-align:center;overflow:hidden;border:1px solid #ffffff14;border-radius:22px;background:#ffffff08;box-shadow:0 18px 50px #0008}.card.next{border-color:#a855f7a6;box-shadow:0 0 0 1px #a855f74d,0 18px 50px #0008,0 0 28px #a855f72e}.card.done{border-color:#22c55e66}.card.locked{opacity:.72}.art{height:auto;aspect-ratio:16/9;background:#ffffff0a}.art img{width:100%;height:100%;object-fit:cover;display:block}.locked .art img{filter:grayscale(.85) brightness(.5)}.badge{position:absolute;top:10px;left:10px;border-radius:999px;padding:5px 11px;background:#0000008c;border:1px solid #ffffff22;font-size:11px;font-weight:800;letter-spacing:.06em}.body{min-height:170px;padding:14px 16px 16px}.body>b{display:inline-block;border:1px solid #a855f759;border-radius:999px;background:#a855f71a;color:var(--purple);padding:3px 9px;font-size:10px;letter-spacing:.14em}.done .body>b{color:#4ade80;border-color:#22c55e59;background:#22c55e14}.locked .body>b{color:var(--muted);border-color:#ffffff1f;background:#ffffff0a}.body h2{margin:13px 0 8px;font-size:21px;line-height:1.15}.body p{margin:0;color:var(--purple);font-size:14px;font-weight:800}.body a{display:inline-block;margin-top:13px;color:#d8b4fe;font-size:13px;font-weight:800;text-decoration:none}.dots{display:flex;justify-content:center;gap:8px;padding:8px 0 12px}.dots i{display:block;width:7px;height:7px;border-radius:50%;background:#ffffff25}.dots i.on{width:37px;border-radius:99px;background:#b861ff;box-shadow:0 0 12px #a855f7}.nav{display:flex;justify-content:center;gap:18px;padding:0 0 3px}.nav button{width:44px;height:44px;border:1px solid #a855f788;border-radius:50%;background:#1b102799;color:#f5eaff;font-size:31px;font-weight:800;line-height:.7}.nav button:active{transform:scale(.95);background:#3a1d55}.loader,.error{padding:80px 15px;text-align:center;color:var(--muted)}.error{color:#f0b2c0}
  </style>
</head>
<body>
  <header><div class="title"><span>AXE · BATTLE PASS</span><span><span class="lvl" id="level">LVL 0</span> <span class="percent" id="percent">0%</span></span></div><div class="bar"><i id="bar"></i></div><div class="meta"><span id="next">Загрузка…</span><span id="cash">—</span></div></header>
  <main id="levels" class="levels"><div class="loader">Загружаем AXE PASS…</div></main>
  <div id="dots" class="dots"></div>
  <nav class="nav" aria-label="Навигация по призам"><button type="button" id="prev" aria-label="Предыдущий приз">‹</button><button type="button" id="nextBtn" aria-label="Следующий приз">›</button></nav>
  <script>
    const tg=window.Telegram?.WebApp,root=document.getElementById('levels'),esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),rub=n=>Math.round(n||0).toLocaleString('ru-RU').replace(/ /g,'.')+'₽',xp=n=>Number.isInteger(n)?String(n):Number(n||0).toFixed(2).replace(/0+$/,'').replace(/\.$/,'');
    const shift=direction=>root.scrollBy({left:direction*(root.clientWidth+12),behavior:'smooth'}),dots=document.getElementById('dots'),setDot=()=>{const i=Math.round(root.scrollLeft/(root.clientWidth+12));dots.querySelectorAll('i').forEach((d,n)=>d.classList.toggle('on',n===i))};document.getElementById('prev').onclick=()=>shift(-1);document.getElementById('nextBtn').onclick=()=>shift(1);root.addEventListener('scroll',()=>requestAnimationFrame(setDot),{passive:true});async function boot(){const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),12000);try{const app=window.Telegram?.WebApp;app?.ready();app?.expand();app?.setHeaderColor?.('#09070e');app?.setBackgroundColor?.('#09070e');const q=new URLSearchParams;if(app?.initData)q.set('initData',app.initData);const dev=new URLSearchParams(location.search).get('user_id');if(dev)q.set('user_id',dev);const r=await fetch('/api/state?'+q,{cache:'no-store',signal:controller.signal});if(!r.ok)throw Error(r.status===401?'Открой AXE PASS кнопкой в боте.':'Сервер вернул '+r.status);const s=await r.json(),p=Math.round(s.levelProgress*100);document.getElementById('level').textContent='LVL '+s.level;document.getElementById('percent').textContent=p+'%';document.getElementById('bar').style.width=p+'%';document.getElementById('next').textContent=s.level>=s.maxLevel?'ПАСС ПРОЙДЕН 🏆':'до LVL '+(s.level+1)+': '+xp(s.xpToNext)+' XP ('+rub(s.rubToNext)+')';document.getElementById('cash').textContent='касса '+rub(s.totalEarned)+' · '+Math.round(s.totalProgress*100)+'%';root.innerHTML=s.levels.map(l=>{const state=l.unlocked?'done':(l.level===s.level+1?'next':'locked'),tag=l.unlocked?'✓ ОТКРЫТ':(l.level===s.level+1?'СЛЕДУЮЩИЙ ПРИЗ':'🔒 ЗАКРЫТ'),link=l.unlocked&&l.link?'<a href="'+esc(l.link)+'">Посмотреть подарок →</a>':'';return '<article class="card '+state+'"><div class="art"><img src="'+esc(l.image)+'" alt=""><span class="badge">'+tag+'</span></div><div class="body"><b>LVL '+l.level+'</b><h2>'+esc(l.title)+'</h2><p>'+ (l.unlocked?'Получен':xp(l.requiredXp)+' XP · '+rub(l.requiredRub))+'</p>'+link+'</div></article>'}).join('');dots.innerHTML=s.levels.map(()=>'<i></i>').join('');requestAnimationFrame(()=>{root.querySelector('.card.next')?.scrollIntoView({block:'nearest',inline:'start'});setDot()})}catch(e){root.innerHTML='<div class="error">'+(e.name==='AbortError'?'Сервер долго не отвечает. Открой пасс ещё раз.':esc(e.message||'Сбой AXE PASS'))+'</div>'}finally{clearTimeout(timeout)}}window.addEventListener('DOMContentLoaded',boot,{once:true});
  </script>
</body>
</html>
