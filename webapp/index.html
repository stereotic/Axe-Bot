<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>AXE · Battle Pass</title>

<script>
  // Страховка идёт первой строкой: если ниже что-то не доедет — на экране будет текст, а не чернота.
  window.__bpFail = function (text) {
    var l = document.getElementById('loader');
    var f = document.getElementById('fatal');
    if (l) l.className = 'loader hide';
    if (f) { document.getElementById('fatalText').textContent = text; f.hidden = false; }
    else { document.body.innerHTML = '<div style="color:#8b85a8;font:14px sans-serif;padding:40px;text-align:center">' + text + '</div>'; }
  };
  window.addEventListener('error', function (e) {
    if (e && e.target && e.target.tagName === 'SCRIPT' && !window.__bpBooted) {
      window.__bpFail('Не загрузился ' + (e.target.src || 'скрипт') + '. Сервер мини-аппа не отвечает.');
    }
  }, true);
  setTimeout(function () {
    if (!window.__bpBooted) window.__bpFail('Мини-ап не запустился за 20 секунд. Сервер недоступен.');
  }, 20000);
</script>

<link rel="stylesheet" href="style.css">
<!-- SDK лежит локально: telegram.org из РФ отвечает по 6+ секунд и блокирует отрисовку. -->
<script src="vendor/telegram-web-app.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<div class="bg"></div>

<header class="head">
  <div class="head-top">
    <div class="head-title">AXE · BATTLE PASS</div>
    <div class="head-level" id="headLevel">LVL 0</div>
  </div>
  <div class="bar"><div class="bar-fill" id="barFill"></div></div>
  <div class="head-meta">
    <span id="metaMain">—</span>
    <span id="metaProgress">—</span>
  </div>
</header>

<main class="track" id="track"></main>

<div class="dots" id="dots"></div>

<nav class="nav">
  <button class="nav-btn" id="navPrev" aria-label="Назад">‹</button>
  <button class="nav-btn" id="navNext" aria-label="Вперёд">›</button>
</nav>

<div class="loader" id="loader"><div class="spinner"></div></div>
<div class="fatal" id="fatal" hidden><p id="fatalText"></p></div>
</body>
</html>
